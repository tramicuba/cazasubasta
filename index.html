<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mi Tienda - CUP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        /* Header con carrito */
        .header {
            background: white;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            color: #1e293b;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .cart-icon:hover {
            background: #e2e8f0;
        }

        .cart-icon span:first-child {
            font-size: 1.4rem;
        }

        .cart-count {
            background: #3b82f6;
            color: white;
            border-radius: 30px;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Panel del carrito (lateral) */
        .cart-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: white;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-panel.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .cart-header h2 {
            font-size: 1.3rem;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cart-item-info {
            flex: 2;
        }

        .cart-item-name {
            font-weight: 500;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: #475569;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-item-actions button {
            background: #f1f5f9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .cart-item-actions span {
            min-width: 24px;
            text-align: center;
        }

        .cart-total {
            padding: 16px 20px;
            border-top: 2px solid #e2e8f0;
            background: #f8fafc;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
        }

        .cart-buttons {
            padding: 16px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-whatsapp:hover {
            background: #128C7E;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
            border: none;
            padding: 10px;
            border-radius: 40px;
            cursor: pointer;
        }

        /* Departamentos */
        .departamentos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 76px;
            z-index: 90;
        }

        .dept-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .dept-btn.active {
            background: #3b82f6;
            color: white;
        }

        /* Grid de productos */
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding: 24px 20px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .product-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .product-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
        }

        .add-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: #2563eb;
        }

        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        /* Overlay para cerrar carrito */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            display: none;
        }

        .cart-overlay.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .productos-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                padding: 16px;
            }
            .product-img {
                height: 140px;
            }
            .product-name {
                font-size: 0.9rem;
            }
            .product-price {
                font-size: 1.1rem;
            }
            .departamentos {
                top: 68px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <h1>🛒 Mi Tienda (CUP)</h1>
    </div>
    <div class="cart-icon" id="cartIcon">
        <span>🛍️</span>
        <span class="cart-count" id="cartCount">0</span>
    </div>
</div>

<div class="departamentos" id="departamentosContainer">
    <button class="dept-btn active" data-id="all">Todos</button>
</div>

<div id="productosContainer" class="productos-grid">
    <div class="empty-message">Cargando productos...</div>
</div>

<!-- Overlay y carrito lateral -->
<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-panel" id="cartPanel">
    <div class="cart-header">
        <h2>Tu pedido</h2>
        <button class="close-cart" id="closeCartBtn">&times;</button>
    </div>
    <div class="cart-items" id="cartItemsList">
        <!-- items dinamicos -->
    </div>
    <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotal">0.00 CUP</span>
    </div>
    <div class="cart-buttons">
        <button class="btn-whatsapp" id="whatsappOrderBtn">📲 Pedir por WhatsApp</button>
        <button class="btn-secondary" id="clearCartBtn">Vaciar carrito</button>
    </div>
</div>

<script>
    // Configuración Supabase (misma que en admin)
    const SUPABASE_URL = 'https://hopssnvzzcwgromqsyyj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvcHNzbnZ6emN3Z3JvbXFzeXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTczNTcsImV4cCI6MjA5NDE5MzM1N30.jAgmJV_eq4MkWboMgqDMYbCF5Kjp3nhn21DQ7xsHGCM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Estado global
    let productos = [];          // todos los productos (solo con precio_cup)
    let departamentos = [];
    let relaciones = {};        // producto_id -> [dept_ids]
    let currentDept = 'all';    // 'all' o id numérico
    let carrito = [];            // { id, nombre, precio, cantidad, foto_url }

    // Elementos DOM
    const productosContainer = document.getElementById('productosContainer');
    const departamentosContainer = document.getElementById('departamentosContainer');
    const cartIcon = document.getElementById('cartIcon');
    const cartPanel = document.getElementById('cartPanel');
    const cartOverlay = document.getElementById('cartOverlay');
    const closeCartBtn = document.getElementById('closeCartBtn');
    const cartItemsList = document.getElementById('cartItemsList');
    const cartTotalSpan = document.getElementById('cartTotal');
    const cartCountSpan = document.getElementById('cartCount');
    const whatsappOrderBtn = document.getElementById('whatsappOrderBtn');
    const clearCartBtn = document.getElementById('clearCartBtn');

    // Número de WhatsApp desde BD
    let whatsappNumero = '521234567890';

    // Cargar datos desde Supabase
    async function cargarDatos() {
        try {
            // Productos con precio CUP no nulo
            const { data: prods, error: errProds } = await supabase
                .from('productos')
                .select('*')
                .not('precio_cup', 'is', null)
                .order('id', { ascending: false });
            if (errProds) throw errProds;
            productos = prods || [];

            // Departamentos
            const { data: depts, error: errDepts } = await supabase
                .from('departamentos')
                .select('*')
                .order('nombre');
            if (errDepts) throw errDepts;
            departamentos = depts || [];

            // Relaciones
            const { data: rels, error: errRels } = await supabase
                .from('producto_departamento')
                .select('*');
            if (errRels) throw errRels;
            relaciones = {};
            (rels || []).forEach(r => {
                if (!relaciones[r.producto_id]) relaciones[r.producto_id] = [];
                relaciones[r.producto_id].push(r.departamento_id);
            });

            // Configuración WhatsApp
            const { data: config, error: errConf } = await supabase
                .from('configuracion')
                .select('valor')
                .eq('clave', 'whatsapp_numero')
                .maybeSingle();
            if (!errConf && config) whatsappNumero = config.valor;

            // Renderizar UI
            renderizarDepartamentos();
            renderizarProductos();
        } catch (error) {
            console.error(error);
            productosContainer.innerHTML = '<div class="empty-message">Error al cargar datos. Recarga la página.</div>';
        }
    }

    function renderizarDepartamentos() {
        let html = '<button class="dept-btn active" data-id="all">Todos</button>';
        departamentos.forEach(d => {
            html += `<button class="dept-btn" data-id="${d.id}">${escapeHtml(d.nombre)}</button>`;
        });
        departamentosContainer.innerHTML = html;

        // Agregar eventos
        document.querySelectorAll('.dept-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const id = btn.dataset.id;
                currentDept = id === 'all' ? 'all' : parseInt(id);
                renderizarProductos();
            });
        });
    }

    function renderizarProductos() {
        let productosFiltrados = [...productos];
        if (currentDept !== 'all') {
            productosFiltrados = productosFiltrados.filter(p => {
                const deptIds = relaciones[p.id] || [];
                return deptIds.includes(currentDept);
            });
        }

        if (productosFiltrados.length === 0) {
            productosContainer.innerHTML = '<div class="empty-message">No hay productos en esta categoría.</div>';
            return;
        }

        productosContainer.innerHTML = productosFiltrados.map(p => {
            const imagenHtml = p.foto_url 
                ? `<img class="product-img" src="${p.foto_url}" alt="${escapeHtml(p.nombre)}" onerror="this.src='https://placehold.co/400x200?text=Sin+imagen'">`
                : `<div class="product-img" style="background:#e2e8f0; display:flex; align-items:center; justify-content:center;">📷 Sin foto</div>`;
            return `
                <div class="product-card" data-id="${p.id}">
                    ${imagenHtml}
                    <div class="product-info">
                        <div class="product-name">${escapeHtml(p.nombre)}</div>
                        <div class="product-price">${p.precio_cup.toFixed(2)} CUP</div>
                        <button class="add-btn" data-id="${p.id}">Añadir al carrito</button>
                    </div>
                </div>
            `;
        }).join('');

        // Eventos a botones de añadir
        document.querySelectorAll('.add-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const prodId = parseInt(btn.dataset.id);
                const producto = productos.find(p => p.id === prodId);
                if (producto) añadirAlCarrito(producto);
            });
        });
    }

    function añadirAlCarrito(producto) {
        const existente = carrito.find(item => item.id === producto.id);
        if (existente) {
            existente.cantidad++;
        } else {
            carrito.push({
                id: producto.id,
                nombre: producto.nombre,
                precio: producto.precio_cup,
                cantidad: 1,
                foto_url: producto.foto_url
            });
        }
        actualizarCarritoUI();
        abrirCarrito(); // opcional: abrir al añadir
    }

    function actualizarCarritoUI() {
        // Actualizar contador
        const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
        cartCountSpan.innerText = totalItems;

        // Actualizar lista del carrito
        if (carrito.length === 0) {
            cartItemsList.innerHTML = '<div style="text-align:center; padding:20px;">Carrito vacío</div>';
            cartTotalSpan.innerText = '0.00 CUP';
            return;
        }

        let html = '';
        let total = 0;
        carrito.forEach((item, idx) => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal;
            html += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${escapeHtml(item.nombre)}</div>
                        <div class="cart-item-price">${item.precio.toFixed(2)} CUP c/u</div>
                    </div>
                    <div class="cart-item-actions">
                        <button class="decr-item" data-idx="${idx}">-</button>
                        <span>${item.cantidad}</span>
                        <button class="incr-item" data-idx="${idx}">+</button>
                        <button class="remove-item" data-idx="${idx}" style="background:#fee2e2; color:#dc2626;">🗑</button>
                    </div>
                </div>
            `;
        });
        cartItemsList.innerHTML = html;
        cartTotalSpan.innerText = total.toFixed(2) + ' CUP';

        // Eventos de modificación
        document.querySelectorAll('.decr-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.idx);
                if (carrito[idx].cantidad > 1) carrito[idx].cantidad--;
                else carrito.splice(idx, 1);
                actualizarCarritoUI();
            });
        });
        document.querySelectorAll('.incr-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.idx);
                carrito[idx].cantidad++;
                actualizarCarritoUI();
            });
        });
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.idx);
                carrito.splice(idx, 1);
                actualizarCarritoUI();
            });
        });
    }

    function vaciarCarrito() {
        if (confirm('¿Vaciar completamente el carrito?')) {
            carrito = [];
            actualizarCarritoUI();
        }
    }

    function enviarPedidoWhatsApp() {
        if (carrito.length === 0) {
            alert('El carrito está vacío.');
            return;
        }
        let mensaje = '🛒 *Nuevo pedido:*%0A';
        carrito.forEach(item => {
            mensaje += `- ${item.nombre} x ${item.cantidad} = ${(item.precio * item.cantidad).toFixed(2)} CUP%0A`;
        });
        const total = carrito.reduce((sum, i) => sum + (i.precio * i.cantidad), 0);
        mensaje += `%0A*Total:* ${total.toFixed(2)} CUP`;
        const url = `https://wa.me/${whatsappNumero}?text=${mensaje}`;
        window.open(url, '_blank');
    }

    // Funciones de UI del carrito lateral
    function abrirCarrito() {
        cartPanel.classList.add('open');
        cartOverlay.classList.add('active');
    }
    function cerrarCarrito() {
        cartPanel.classList.remove('open');
        cartOverlay.classList.remove('active');
    }

    cartIcon.addEventListener('click', abrirCarrito);
    closeCartBtn.addEventListener('click', cerrarCarrito);
    cartOverlay.addEventListener('click', cerrarCarrito);
    clearCartBtn.addEventListener('click', vaciarCarrito);
    whatsappOrderBtn.addEventListener('click', enviarPedidoWhatsApp);

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Inicializar
    cargarDatos();
</script>
</body>
</html>
