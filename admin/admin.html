<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container login-container">
        <div class="card">
            <h2>Acceso Administrador</h2>
            <div id="loginMessage"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@tutienda.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••">
            </div>
            <button id="loginBtn" style="width:100%">Iniciar sesión</button>
        </div>
    </div>

   <script src="auth.js"></script>
<script>
    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            document.getElementById('loginMessage').innerHTML = `<div class="message error">${error.message}</div>`;
        } else {
            window.location.href = 'productos.html';
        }
    };
</script>
</body>
</html>
