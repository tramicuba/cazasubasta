<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Configuración</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
        .current-number {
            background: #e0f2fe;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border-left: 4px solid #3b82f6;
        }
        .current-number span {
            font-weight: bold;
            font-family: monospace;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="productos.html">Productos</a>
        <a href="departamentos.html">Departamentos</a>
        <a href="config.html">Configuración</a>
        <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>Configuración general</h2>
            <div id="configMessage"></div>
            
            <!-- Muestra el número actual guardado -->
            <div class="current-number" id="currentNumberDisplay">
                ?? Número actual: <span id="currentNumberSpan">---</span>
            </div>
            
            <div class="form-group">
                <label>Nuevo número de WhatsApp (código país sin '+', ejemplo: 521234567890)</label>
                <input type="text" id="whatsappNum" placeholder="521234567890">
            </div>
            <button id="saveWspBtn">Guardar número</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        async function verificarAuth() {
            const user = await window.checkAuth();
            if (!user) {
                window.location.href = 'admin.html';
                return false;
            }
            return true;
        }

        async function cargarConfiguracion() {
            const supabase = window.supabaseClient;
            const { data, error } = await supabase
                .from('configuracion')
                .select('valor')
                .eq('clave', 'whatsapp_numero')
                .maybeSingle();
            
            if (error) {
                console.error('Error cargando configuración:', error);
                document.getElementById('configMessage').innerHTML = '<div class="message error">Error al cargar configuración</div>';
                return;
            }
            
            const numeroActual = data?.valor || '521234567890';
            document.getElementById('currentNumberSpan').innerText = numeroActual;
            document.getElementById('whatsappNum').value = '';
            document.getElementById('whatsappNum').placeholder = `Ejemplo: ${numeroActual}`;
        }

        async function guardarConfiguracion() {
            const nuevoNumero = document.getElementById('whatsappNum').value.trim();
            if (!nuevoNumero) {
                document.getElementById('configMessage').innerHTML = '<div class="message error">Debe escribir un número</div>';
                return;
            }
            
            const supabase = window.supabaseClient;
            const { error } = await supabase
                .from('configuracion')
                .upsert({ clave: 'whatsapp_numero', valor: nuevoNumero }, { onConflict: 'clave' });
            
            if (error) {
                console.error('Error guardando:', error);
                document.getElementById('configMessage').innerHTML = `<div class="message error">Error al guardar: ${error.message}</div>`;
            } else {
                document.getElementById('configMessage').innerHTML = '<div class="message success">Número guardado correctamente</div>';
                // Actualizar la visualización
                document.getElementById('currentNumberSpan').innerText = nuevoNumero;
                document.getElementById('whatsappNum').value = '';
                document.getElementById('whatsappNum').placeholder = `Ejemplo: ${nuevoNumero}`;
                // Limpiar mensaje después de 3 segundos
                setTimeout(() => {
                    const msgDiv = document.getElementById('configMessage');
                    if (msgDiv) msgDiv.innerHTML = '';
                }, 3000);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await window.logout();
        });

        document.getElementById('saveWspBtn').addEventListener('click', guardarConfiguracion);

        (async () => {
            const ok = await verificarAuth();
            if (ok) {
                await cargarConfiguracion();
            }
        })();
    </script>
</body>
</html>
