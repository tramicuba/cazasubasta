<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Configuraci&oacute;n</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
        .whatsapp-logo {
            display: inline-block;
            background: #25D366;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
            margin-right: 8px;
        }
        .current-number {
            background: #e0f2fe;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 0.95rem;
            border-left: 4px solid #0284c7;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .current-number span:first-child {
            font-weight: bold;
        }
        .current-number span:last-child {
            font-weight: 700;
            font-family: monospace;
            font-size: 1.1rem;
            background: white;
            padding: 4px 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="productos.html">Productos</a>
        <a href="departamentos.html">Departamentos</a>
        <a href="config.html">Configuraci&oacute;n</a>
        <button class="logout-btn" id="logoutBtn">Cerrar sesi&oacute;n</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>Configuraci&oacute;n general</h2>
            <div id="configMessage"></div>
            <div class="current-number" id="currentNumberDisplay">
                <span class="whatsapp-logo">💬</span>
                <span>WhatsApp:</span>
                <span id="currentNumberSpan">---</span>
            </div>
            <div class="form-group">
                <label>Nuevo n&uacute;mero de WhatsApp (c&oacute;digo pa&iacute;s sin '+', ejemplo: 521234567890)</label>
                <input type="text" id="whatsappNum" placeholder="521234567890">
            </div>
            <button id="saveWspBtn">Guardar n&uacute;mero</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        async function verificarAuth() {
            const user = await window.checkAuth();
            if (!user) {
                window.location.href = 'admin.html';
                return false;
            }
            return true;
        }

        async function cargarConfiguracion() {
            const supabase = window.supabaseClient;
            const { data, error } = await supabase
                .from('configuracion')
                .select('valor')
                .eq('clave', 'whatsapp_numero')
                .maybeSingle();
            if (error) {
                console.error('Error cargando configuraci&oacute;n:', error);
                document.getElementById('configMessage').innerHTML = '<div class="message error">Error al cargar configuraci&oacute;n</div>';
                return;
            }
            const numeroActual = data?.valor || '521234567890';
            document.getElementById('currentNumberSpan').innerText = numeroActual;
            document.getElementById('whatsappNum').value = '';
            document.getElementById('whatsappNum').placeholder = `Ejemplo: ${numeroActual}`;
        }

        async function guardarConfiguracion() {
            const nuevoNumero = document.getElementById('whatsappNum').value.trim();
            if (!nuevoNumero) {
                document.getElementById('configMessage').innerHTML = '<div class="message error">Debe escribir un n&uacute;mero</div>';
                return;
            }
            const supabase = window.supabaseClient;
            const { error } = await supabase
                .from('configuracion')
                .upsert({ clave: 'whatsapp_numero', valor: nuevoNumero }, { onConflict: 'clave' });
            if (error) {
                console.error('Error guardando:', error);
                document.getElementById('configMessage').innerHTML = `<div class="message error">Error al guardar: ${error.message}</div>`;
            } else {
                document.getElementById('configMessage').innerHTML = '<div class="message success">N&uacute;mero guardado correctamente</div>';
                document.getElementById('currentNumberSpan').innerText = nuevoNumero;
                document.getElementById('whatsappNum').value = '';
                document.getElementById('whatsappNum').placeholder = `Ejemplo: ${nuevoNumero}`;
                setTimeout(() => {
                    const msgDiv = document.getElementById('configMessage');
                    if (msgDiv) msgDiv.innerHTML = '';
                }, 3000);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await window.logout();
        });
        document.getElementById('saveWspBtn').addEventListener('click', guardarConfiguracion);

        (async () => {
            const ok = await verificarAuth();
            if (ok) await cargarConfiguracion();
        })();
    </script>
</body>
</html>
